    <title>Which Movie To Watch!</title>
    <script>
      // SEO boot shims (must run before the app loads):
      // 1. Legacy hash-URL redirect: /#/discover?movie=123 → /discover?movie=123
      //    (old shared links keep working after the HashRouter → BrowserRouter migration)
      // 2. GitHub Pages SPA fallback restore: 404.html stashes the requested
      //    path in sessionStorage and bounces to /; we restore it here.
      // 3. Literal .html URL normalization: prerendered pages are written to
      //    disk as e.g. /trending.html, and GitHub Pages serves that path
      //    verbatim. If someone loads the literal .html URL, strip the
      //    suffix so the client router's pathname matches the canonical
      //    route once React hydrates. Runs as a final pass over whatever
      //    pathname is current after steps 1-2 (a restored/redirected path
      //    could itself end in .html), so it's read fresh here rather than
      //    branched on above.
      (function () {
        try {
          var redirect = sessionStorage.getItem("wmtw:redirect");
          if (redirect) {
            sessionStorage.removeItem("wmtw:redirect");
            history.replaceState(null, "", redirect);
          } else if (location.hash.indexOf("#/") === 0) {
            var target = location.hash.slice(1);
            // Old links sometimes used /#/?movie=123 (home + param) — the
            // discovery page owns movie deep links, so send those there.
            if (target.indexOf("/?movie=") === 0) {
              target = "/discover" + target.slice(1);
            }
            history.replaceState(null, "", target);
          }
        } catch (e) {
          /* sessionStorage unavailable — fine, land on / */
        }
        try {
          if (location.pathname.slice(-5) === ".html") {
            var path =
              location.pathname === "/index.html"
                ? "/"
                : location.pathname.slice(0, -5);
            history.replaceState(
              null,
              "",
              path + location.search + location.hash,
            );
          }
        } catch (e) {
          /* history API unavailable — fine, literal .html URL just won't normalize */
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("theme-preferences"));
          if (stored && stored.state) {
            if (stored.state.mode === "dark")
              document.documentElement.classList.add("dark");
            if (stored.state.preset)
              document.documentElement.classList.add(
                "theme-" + stored.state.preset,
              );
          } else {
            // First visit: check system preference
            if (
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
              document.documentElement.classList.add("dark");
            }
            // Default preset
            document.documentElement.classList.add("theme-cinema-gold");
          }
        } catch (e) {
          document.documentElement.classList.add("theme-cinema-gold");
        }
      })();
    </script>
    <!-- CSP meta tag placed AFTER the inline FOUC script so it does not block the theme initialiser.
         Meta-tag CSP only applies to content loaded after this tag in the document.

         Resource inventory (why each origin is allowed):
           script-src:  unsafe-eval — Spline runtime (third-party) uses dynamic code generation internally
                        wasm-unsafe-eval — Spline WebAssembly modules
                        simpleanalyticscdn — cookieless analytics
           worker-src:  blob: — Spline creates blob: Workers for sort/decode pipelines
           style-src:   unsafe-inline — Tailwind v4 and Framer Motion inject inline styles at runtime
                        fonts.googleapis.com — Google Fonts CSS loaded by Spline 3D text objects
           font-src:    fonts.gstatic.com — Google Fonts WOFF2 files served from gstatic CDN,
                        data: — Spline runtime embeds scene fonts as base64 data URIs
           img-src:     image.tmdb.org — movie posters/backdrops, data: — SVG clay textures,
                        blob: — story card canvas export
           connect-src: api.themoviedb.org — TMDB API, omdbapi — ratings, ipinfo — geolocation,
                        corsproxy — story card CORS poster fetch, simpleanalyticscdn — analytics beacon,
                        prod.spline.design — .splinecode scene files, unpkg.com — detect-gpu benchmarks
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://scripts.simpleanalyticscdn.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://image.tmdb.org data: blob: https://*.simpleanalyticscdn.com; connect-src 'self' https://api.themoviedb.org https://www.omdbapi.com https://ipinfo.io https://corsproxy.io https://queue.simpleanalyticscdn.com https://prod.spline.design https://unpkg.com; media-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self';"
    />
  </head>
