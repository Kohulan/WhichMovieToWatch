name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild — refreshes trending/hub lists, movie pages, and sitemap lastmod
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          VITE_TMDB_API_KEY: ${{ secrets.API_KEY }}
          VITE_OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}

      # Rolling TMDB snapshot so a TMDB outage never breaks the scheduled deploy
      - uses: actions/cache@v4
        with:
          path: tools/.tmdb-snapshot.json
          key: tmdb-snapshot-${{ github.run_id }}
          restore-keys: |
            tmdb-snapshot-

      - name: Prerender SEO pages
        run: npm run prerender
        env:
          VITE_TMDB_API_KEY: ${{ secrets.API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
